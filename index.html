<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্রশ্নপত্র জেনারেটর</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--card:#fff;--tx:#1f1f1c;--mut:#6b6a63;--bd:#e4e2db;--ac:#c4552d;--ok:#1d7a46;--okbg:#e6f4ec}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--card:#262624;--tx:#ecebe6;--mut:#a3a199;--bd:#3a3935;--ac:#e8794d;--ok:#6fcf97;--okbg:#1f3a2b;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Hind Siliguri",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
textarea,select,input{width:100%;box-sizing:border-box;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
textarea{min-height:140px;resize:vertical}
.row{display:flex;gap:10px;margin:10px 0}.row>div{flex:1;min-width:0}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:6px}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd);width:auto;font-weight:500;padding:8px 12px;font-size:14px;margin:0}
button:disabled{opacity:.6}
.msg{margin-top:14px;color:var(--mut)}
.prog{height:8px;background:var(--bd);border-radius:6px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.paper{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 16px;margin-top:18px}
.ph{text-align:center;border-bottom:2px solid var(--tx);padding-bottom:10px;margin-bottom:14px}
.ph h2{margin:0;font-size:20px}.ph .meta{display:flex;justify-content:space-between;margin-top:6px;font-size:14px;gap:8px;flex-wrap:wrap}
.q{margin:14px 0}.q p{margin:0 0 4px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:15px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.key{margin-top:18px;border-top:1px dashed var(--bd);padding-top:12px}
.key .grid{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px}
.key .grid span{background:var(--okbg);color:var(--ok);padding:1px 8px;border-radius:6px}
.bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.part{display:flex;justify-content:space-between;gap:12px;margin:5px 0;font-size:15px}.part span:last-child{flex:none;font-weight:600}.cq{margin:18px 0;padding-bottom:10px;border-bottom:1px dashed var(--bd)}.cq p{margin:0 0 6px;font-weight:600}
@media print{main>*:not(#out){display:none}.bar{display:none}.paper{border:0}}
</style>
</head>
<body>
<main>
<h1>প্রশ্নপত্র জেনারেটর</h1>
<p class="sub">পরীক্ষার তথ্য ও সৃজনশীল উদ্দীপক দিন, MCQ প্রশ্নপত্র তৈরি হবে। শেষ হলে জানিয়ে দেবে।</p>
<label for="inst">প্রতিষ্ঠানের নাম</label><input id="inst" placeholder="যেমন: ঢাকা সরকারি উচ্চ বিদ্যালয়">
<div class="row">
<div><label for="cls">শ্রেণি</label><input id="cls" placeholder="যেমন: অষ্টম"></div>
<div><label for="subj">বিষয়</label><input id="subj" placeholder="যেমন: ইতিহাস"></div>
</div>
<label for="ename">পরীক্ষার নাম</label><input id="ename" placeholder="যেমন: দ্বিতীয় সাময়িক পরীক্ষা">
<div class="row">
<div><label for="etime">সময় (মিনিট)</label><input id="etime" type="number" min="1"></div>
<div><label for="emarks">পূর্ণমান</label><input id="emarks" type="number" min="1"></div>
</div>
<label for="stem" id="stemLabel">সৃজনশীল প্রশ্ন / উদ্দীপক / টপিক</label>
<textarea id="stem"></textarea>
<div class="row">
<div><label for="type">প্রশ্নের ধরন</label><select id="type"><option value="mcq">MCQ (বহুনির্বাচনি)</option><option value="creative">সৃজনশীল</option><option value="short">সংক্ষিপ্ত প্রশ্ন</option></select></div>
<div id="smodeWrap" hidden><label for="smode">উদ্দীপক</label><select id="smode"><option value="own">আমি নিজে দেব</option><option value="auto">টপিক থেকে বানান</option></select></div>
</div>
<div class="row">
<div><label for="n">প্রশ্নের সংখ্যা</label><select id="n"></select></div>
<div><label for="lang">ভাষা</label><select id="lang"><option value="Bengali">বাংলা</option><option value="English">English</option></select></div>
</div>
<button id="go">প্রশ্নপত্র বানান</button>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const LAB={Bengali:["ক","খ","গ","ঘ"],English:["A","B","C","D"]};
const BN="০১২৩৪৫৬৭৮৯";
const num=(x,l)=>l==="Bengali"?String(x).replace(/\d/g,d=>BN[d]):String(x);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const COUNTS={mcq:[[20,"২০টি"],[25,"২৫টি"],[50,"৫০টি"]],creative:[[1,"১টি"],[3,"৩টি"],[5,"৫টি"],[7,"৭টি"]],short:[[5,"৫টি"],[10,"১০টি"],[15,"১৫টি"],[20,"২০টি"]]};
function syncForm(){
  const t=$("type").value,n=$("n");
  $("smodeWrap").hidden=t!=="creative";
  n.textContent="";
  COUNTS[t].forEach(([v,l],i)=>{const o=document.createElement("option");o.value=v;o.textContent=l;if(v===({mcq:25,creative:3,short:10})[t])o.selected=true;n.appendChild(o);});
  $("stemLabel").textContent=t==="short"?"টপিক / অধ্যায় / উদ্দীপক":t==="mcq"?"সৃজনশীল প্রশ্ন / উদ্দীপক / টপিক":($("smode").value==="own"?"উদ্দীপক (এটি প্রথম প্রশ্নে হুবহু ব্যবহার হবে)":"টপিক / অধ্যায়");
}
$("type").onchange=syncForm;$("smode").onchange=syncForm;syncForm();
const PL={Bengali:["ক","খ","গ","ঘ"],English:["a","b","c","d"]};
function answers(it){return [it.ak,it.akh,it.ag,it.agh];}
function parts(it){return [[0,it.k,1],[1,it.kh,2],[2,it.g,3],[3,it.gh,4]];}
let state=null,partial=null,wake=null;

function paperText(withKey){
  const s=state,lab=LAB[s.lang],bn=s.lang==="Bengali";
  let t=s.inst+"\n"+s.name+"\n"+(bn?"শ্রেণি: ":"Class: ")+s.cls+"   "+(bn?"বিষয়: ":"Subject: ")+s.subj+"\n"+(bn?"সময়: ":"Time: ")+num(s.time,s.lang)+(bn?" মিনিট":" minutes")+"   "+(bn?"পূর্ণমান: ":"Full marks: ")+num(s.marks,s.lang)+"\n\n";
  if(s.type==="creative"){
    s.items.forEach((it,i)=>{t+=num(i+1,s.lang)+". "+it.stem+"\n"+parts(it).map(([j,x,m])=>PL[s.lang][j]+") "+x+" ["+num(m,s.lang)+"]").join("\n")+"\n\n";});
    if(withKey)t+=(bn?"উত্তরমালা\n":"Answer key\n")+s.items.map((it,i)=>num(i+1,s.lang)+". "+answers(it).map((a,j)=>PL[s.lang][j]+") "+a).join("\n")).join("\n\n");
    return t;
  }
  if(s.type==="short"){
    s.items.forEach((it,i)=>{t+=num(i+1,s.lang)+". "+it.q+"\n";});
    if(withKey)t+="\n"+(bn?"উত্তরমালা\n":"Answer key\n")+s.items.map((it,i)=>num(i+1,s.lang)+". "+it.a).join("\n");
    return t;
  }
  s.items.forEach((it,i)=>{t+=num(i+1,s.lang)+". "+it.q+"\n"+it.options.map((o,j)=>lab[j]+") "+o).join("\n")+"\n\n";});
  if(withKey)t+=(bn?"উত্তরমালা\n":"Answer key\n")+s.items.map((it,i)=>num(i+1,s.lang)+"-"+lab[it.answer]).join(", ");
  return t;
}
function render(){
  const out=$("out");out.textContent="";
  const s=state,lab=LAB[s.lang],bn=s.lang==="Bengali";
  const p=document.createElement("div");p.className="paper";
  const h=document.createElement("div");h.className="ph";
  const h1=document.createElement("h2");h1.textContent=s.inst;h.appendChild(h1);
  const h2=document.createElement("div");h2.style.fontWeight="600";h2.textContent=s.name;h.appendChild(h2);
  const h3=document.createElement("div");h3.style.fontSize="14px";h3.textContent=(bn?"শ্রেণি: ":"Class: ")+s.cls+"   |   "+(bn?"বিষয়: ":"Subject: ")+s.subj;h.appendChild(h3);
  const meta=document.createElement("div");meta.className="meta";
  const a=document.createElement("span");a.textContent=(bn?"সময়: ":"Time: ")+num(s.time,s.lang)+(bn?" মিনিট":" min");
  const b=document.createElement("span");b.textContent=(bn?"পূর্ণমান: ":"Full marks: ")+num(s.marks,s.lang);
  meta.append(a,b);h.appendChild(meta);p.appendChild(h);
  if(s.type==="creative"){
    s.items.forEach((it,i)=>{
      const d=document.createElement("div");d.className="cq";
      const q=document.createElement("p");q.textContent=num(i+1,s.lang)+". "+it.stem;d.appendChild(q);
      parts(it).forEach(([j,x,m])=>{
        const r=document.createElement("div");r.className="part";
        const a1=document.createElement("span");a1.textContent=PL[s.lang][j]+") "+x;
        const a2=document.createElement("span");a2.textContent=num(m,s.lang);
        r.append(a1,a2);d.appendChild(r);
      });
      p.appendChild(d);
    });
    out.appendChild(p);
    const key=document.createElement("div");key.className="key";key.hidden=true;
    const kt=document.createElement("strong");kt.textContent=bn?"উত্তরমালা":"Answer key";key.appendChild(kt);
    s.items.forEach((it,i)=>{
      const kb=document.createElement("div");kb.className="cq";
      const kh=document.createElement("p");kh.textContent=(bn?"প্রশ্ন ":"Question ")+num(i+1,s.lang);kb.appendChild(kh);
      answers(it).forEach((a,j)=>{const r=document.createElement("div");r.className="part";const t1=document.createElement("span");t1.textContent=PL[s.lang][j]+") "+a;r.appendChild(t1);kb.appendChild(r);});
      key.appendChild(kb);
    });
    p.appendChild(key);
    out.appendChild(p);
    const bar=document.createElement("div");bar.className="bar";
    const k=document.createElement("button");k.className="sec";k.textContent="উত্তর দেখান";
    k.onclick=()=>{key.hidden=!key.hidden;k.textContent=key.hidden?"উত্তর দেখান":"উত্তর লুকান";};
    const c1=document.createElement("button");c1.className="sec";c1.textContent="প্রশ্নপত্র কপি";
    const c2=document.createElement("button");c2.className="sec";c2.textContent="উত্তরসহ কপি";
    const cp=(btn,w)=>async()=>{try{await navigator.clipboard.writeText(paperText(w));btn.textContent="কপি হয়েছে";}catch(e){btn.textContent="কপি করা যায়নি";}};
    c1.onclick=cp(c1,false);c2.onclick=cp(c2,true);
    const pr=document.createElement("button");pr.className="sec";pr.textContent="প্রিন্ট / PDF";pr.onclick=()=>{key.hidden=true;k.textContent="উত্তর দেখান";window.print();};
    bar.append(k,c1,c2,pr);out.appendChild(bar);
    return;
  }
  if(s.type==="short"){
    s.items.forEach((it,i)=>{
      const d=document.createElement("div");d.className="q";
      const q=document.createElement("p");q.textContent=num(i+1,s.lang)+". "+it.q;d.appendChild(q);
      p.appendChild(d);
    });
    const key=document.createElement("div");key.className="key";key.hidden=true;
    const kt=document.createElement("strong");kt.textContent=bn?"উত্তরমালা":"Answer key";key.appendChild(kt);
    s.items.forEach((it,i)=>{const r=document.createElement("div");r.className="part";const t1=document.createElement("span");t1.textContent=num(i+1,s.lang)+". "+it.a;r.appendChild(t1);key.appendChild(r);});
    p.appendChild(key);out.appendChild(p);
    const bar=document.createElement("div");bar.className="bar";
    const k=document.createElement("button");k.className="sec";k.textContent="উত্তর দেখান";
    k.onclick=()=>{key.hidden=!key.hidden;k.textContent=key.hidden?"উত্তর দেখান":"উত্তর লুকান";};
    const c1=document.createElement("button");c1.className="sec";c1.textContent="প্রশ্নপত্র কপি";
    const c2=document.createElement("button");c2.className="sec";c2.textContent="উত্তরসহ কপি";
    const cp=(btn,w)=>async()=>{try{await navigator.clipboard.writeText(paperText(w));btn.textContent="কপি হয়েছে";}catch(e){btn.textContent="কপি করা যায়নি";}};
    c1.onclick=cp(c1,false);c2.onclick=cp(c2,true);
    const pr=document.createElement("button");pr.className="sec";pr.textContent="প্রিন্ট / PDF";pr.onclick=()=>{key.hidden=true;k.textContent="উত্তর দেখান";window.print();};
    bar.append(k,c1,c2,pr);out.appendChild(bar);
    return;
  }
  s.items.forEach((it,i)=>{
    const d=document.createElement("div");d.className="q";
    const q=document.createElement("p");q.textContent=num(i+1,s.lang)+". "+it.q;d.appendChild(q);
    const o=document.createElement("div");o.className="opts";
    it.options.forEach((x,j)=>{const e=document.createElement("div");e.textContent=lab[j]+") "+x;o.appendChild(e);});
    d.appendChild(o);p.appendChild(d);
  });
  const key=document.createElement("div");key.className="key";key.hidden=true;
  const kt=document.createElement("strong");kt.textContent=bn?"উত্তরমালা":"Answer key";key.appendChild(kt);
  const g=document.createElement("div");g.className="grid";
  s.items.forEach((it,i)=>{const e=document.createElement("span");e.textContent=num(i+1,s.lang)+"-"+lab[it.answer];g.appendChild(e);});
  key.appendChild(g);p.appendChild(key);out.appendChild(p);
  const bar=document.createElement("div");bar.className="bar";
  const k=document.createElement("button");k.className="sec";k.textContent="উত্তরমালা দেখান";
  k.onclick=()=>{key.hidden=!key.hidden;k.textContent=key.hidden?"উত্তরমালা দেখান":"উত্তরমালা লুকান";};
  const c1=document.createElement("button");c1.className="sec";c1.textContent="প্রশ্নপত্র কপি";
  const c2=document.createElement("button");c2.className="sec";c2.textContent="উত্তরসহ কপি";
  const cp=(btn,w)=>async()=>{try{await navigator.clipboard.writeText(paperText(w));btn.textContent="কপি হয়েছে";}catch(e){btn.textContent="কপি করা যায়নি";}};
  c1.onclick=cp(c1,false);c2.onclick=cp(c2,true);
  const pr=document.createElement("button");pr.className="sec";pr.textContent="প্রিন্ট / PDF";pr.onclick=()=>{key.hidden=true;window.print();};
  bar.append(k,c1,c2,pr);out.appendChild(bar);
}
function say(t,pct){
  const out=$("out");out.textContent="";
  const m=document.createElement("div");m.className="msg";m.textContent=t;out.appendChild(m);
  if(pct!=null){const p=document.createElement("div");p.className="prog";const i=document.createElement("i");i.style.width=pct+"%";p.appendChild(i);out.appendChild(p);}
}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start(c.currentTime+d);o.stop(c.currentTime+d+.18);});}catch(e){}}
function notifyDone(msg){
  beep();
  const old=document.title;document.title="✅ "+msg;
  setTimeout(()=>{document.title=old;},15000);
  try{if(window.Notification&&Notification.permission==="granted")new Notification("প্রশ্নপত্র জেনারেটর",{body:msg});}catch(e){}
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}
let lastErr="";
async function fetchBatch(args){
  for(let a=0;a<6;a++){
    try{
      const r=await fetch("/.netlify/functions/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(args)});
      const txt=await r.text();
      let j={};try{j=JSON.parse(txt);}catch(e){}
      if(r.status===429||r.status===503){lastErr="HTTP "+r.status+" (সীমা শেষ বা সার্ভার ব্যস্ত), অপেক্ষা করছে";await sleep(20000);continue;}
      if(!r.ok){lastErr="HTTP "+r.status+": "+String(j.error||txt).replace(/\s+/g," ").slice(0,300);if(r.status<500)return null;await sleep(8000);continue;}
      return j.items||[];
    }catch(e){lastErr=String(e);await sleep(8000);}
  }
  return null;
}
const norm=s=>s.replace(/\s+/g,"").toLowerCase();

$("go").onclick=async()=>{
  const inst=$("inst").value.trim(),cls=$("cls").value.trim(),subj=$("subj").value.trim(),name=$("ename").value.trim(),time=$("etime").value,marks=$("emarks").value,stem=$("stem").value.trim();
  if(!inst||!cls||!subj||!name||!time||!marks||!stem){say("প্রতিষ্ঠান, শ্রেণি, বিষয়, পরীক্ষার নাম, সময়, পূর্ণমান ও উদ্দীপক সব দিন।");return;}
  const type=$("type").value,auto=type==="creative"&&$("smode").value==="auto",total=+$("n").value,lang=$("lang").value,btn=$("go"),BATCH=type==="creative"?2:type==="short"?6:8;
  const sig=[type,auto,inst,cls,subj,name,stem,total,lang].join("|");
  let items=(partial&&partial.sig===sig)?partial.items:[];
  btn.disabled=true;
  try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission();}catch(e){}
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen");}catch(e){}
  let fails=0;lastErr="";
  while(items.length<total&&fails<3){
    say(num(items.length,lang)+"/"+num(total,lang)+" "+(lang==="Bengali"?"টি প্রশ্ন তৈরি হয়েছে… পেজটি খোলা রাখুন":"questions ready… keep this page open")+(lastErr?" | সমস্যা: "+lastErr:""),items.length/total*100);
    const need=Math.min(BATCH,total-items.length);
    const got=await fetchBatch({type,auto,first:items.length===0,name:subj+" (Class "+cls+") - "+name,stem:"Subject: "+subj+"\nClass/Level: "+cls+"\n\n"+stem,lang,need,avoid:items.map(x=>type==="creative"?x.stem.slice(0,80):x.q)});
    if(!got){fails++;continue;}
    const key=x=>norm(type==="creative"?x.stem:x.q);
    const seen=new Set(items.map(key));
    let added=0;
    for(const x of got){if(!seen.has(key(x))&&items.length<total){items.push(x);seen.add(key(x));added++;}}
    if(!added){fails++;if(!lastErr)lastErr="মডেল সঠিক ফরম্যাটে প্রশ্ন দেয়নি";}else{fails=0;lastErr="";}
    if(items.length<total)await sleep(5000);
  }
  if(wake){try{wake.release();}catch(e){}wake=null;}
  btn.disabled=false;
  if(items.length>=total){
    partial=null;state={type,inst,name,cls,subj,time,marks,lang,items};render();
    notifyDone(num(total,lang)+(lang==="Bengali"?"টি প্রশ্ন তৈরি হয়ে গেছে":" questions are ready"));
  }else{
    partial={sig,items};
    say(num(items.length,lang)+"/"+num(total,lang)+" টি তৈরি হয়েছে, এরপর থেমে গেছে (সম্ভবত API সীমা)। একটু পরে আবার বাটন চাপুন, বাকিগুলো থেকে শুরু হবে।"+(lastErr?" কারণ: "+lastErr:""));
    notifyDone("কাজ থেমে গেছে: "+num(items.length,lang)+"/"+num(total,lang));
  }
};
</script>
